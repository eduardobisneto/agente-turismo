# Stack completa da Aventura Organizada.
#
# Requer os outros 4 repositórios clonados como pastas irmãs desta (mesmo
# diretório pai), com esses nomes exatos:
#   ../greatgrandson.aventuraorganizada.backoffice.web
#   ../greatgrandson.aventuraorganizada.marketplace.api
#   ../greatgrandson.aventuraorganizada.identity.api
#   ../greatgrandson.aventuraorganizada.viagens.api
#
# As 3 APIs .NET esperam um Postgres já existente com os bancos/usuários
# criados (ver scripts/00-setup.sql e scripts/create.sql em cada uma) —
# não um serviço "postgres" deste compose. Por padrão apontam para
# host.docker.internal (o Postgres rodando no host, ex: via Docker
# Desktop/pgAdmin). Ajuste POSTGRES_HOST no .env se for diferente.
#
# Copie .env.example para .env antes de subir:
#   cp .env.example .env
#   docker compose build --no-cache
#   docker compose up

services:
  greatgrandson-aventuraorganizada-marketplace-web:
    build: .
    image: greatgrandson-aventuraorganizada-marketplace-web
    container_name: greatgrandson-aventuraorganizada-marketplace-web-container
    environment:
      NODE_ENV: production
      PORT: 3000
      HOST: 0.0.0.0
    ports:
      - "3000:3000"
    restart: unless-stopped
